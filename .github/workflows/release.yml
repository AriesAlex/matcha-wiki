name: Publish corrected pack

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Validate and build
        run: bun run validate

      - name: Publish GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/Matcha_Flavoured_1_03_RU.zip
          dist/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "Matcha Flavoured 1.03 RU — $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
