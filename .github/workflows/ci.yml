name: Check pack and wiki

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Validate pack and wiki
        run: bun run validate

      - name: Upload corrected pack
        uses: actions/upload-artifact@v7
        with:
          name: Matcha-Flavoured-1.03-RU
          path: |
            dist/Matcha_Flavoured_1_03_RU.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
